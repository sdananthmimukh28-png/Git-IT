<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | Cosmetic Glow</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">COSMETIC <span>GLOW</span></a>
            <nav class="nav-links">
                <a href="index.html">หน้าแรก</a>
                <a href="shop.html">สินค้าทั้งหมด</a>
                <a href="promo.html">โปรโมชั่น</a>
                <a href="#">บทความ</a>
                <a href="contact.html">ติดต่อเรา</a>
            </nav>
            <div class="nav-icons">
                <a href="cart.html" class="cart-icon active">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="section-title">ตะกร้าสินค้า</h1>

        <table class="cart-table">
            <thead>
                <tr>
                    <th>สินค้า</th>
                    <th>ราคา</th>
                    <th>จำนวน</th>
                    <th>รวม</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>

        <div class="cart-summary">
            <div class="summary-row">
                <span>ยอดรวม</span>
                <span class="total">฿0</span>
            </div>
            <p style="font-size: 0.9rem; color: #666; margin-bottom: 20px;">*ยังไม่รวมค่าจัดส่ง</p>
            <a href="checkout.html" class="btn btn-primary" style="display:block; text-align:center;">ชำระเงิน</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
